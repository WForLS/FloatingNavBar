plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lspatch.floatingnav'
    compileSdk 34

    defaultConfig {
        applicationId "com.lspatch.floatingnav"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API，仅编译期需要，不打进 APK
    compileOnly 'de.robv.android.xposed:api:82'
}
